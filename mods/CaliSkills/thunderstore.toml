[config]
schemaVersion = "0.0.1"

[package]
# namespace and versionNumber are overridden at pack time from Directory.Build.props
# (ThunderstoreTeam) and the .csproj (<Version>), see the PackThunderstore target.
namespace = "caligola"
name = "CaliSkills"
versionNumber = "1.0.0"
description = "A pack of new abilities. Pinball: throw a ball that bounces for 10 seconds and knocks players back. Every player in the lobby needs it."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../dist"

[[build.copy]]
source = "./bin/Release/netstandard2.1/CaliSkills.dll"
target = "CaliSkills.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["bopl-battle"]

[publish.categories]
bopl-battle = ["mods"]

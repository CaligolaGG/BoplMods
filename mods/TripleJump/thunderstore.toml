[config]
schemaVersion = "0.0.1"

[package]
# namespace and versionNumber are overridden at pack time from Directory.Build.props
# (ThunderstoreTeam) and the .csproj (<Version>), see the PackThunderstore target.
namespace = "caligola"
name = "TripleJump"
versionNumber = "1.0.0"
description = "Jump up to two extra times in mid-air. Every player in the lobby needs it."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../dist"

# Loose DLLs at the zip root are installed by the mod manager into BepInEx/plugins/<Team>-<Mod>/
[[build.copy]]
source = "./bin/Release/netstandard2.1/TripleJump.dll"
target = "TripleJump.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["bopl-battle"]

[publish.categories]
bopl-battle = ["mods"]
